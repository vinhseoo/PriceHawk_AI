version: '3.8'

# ─────────────────────────────────────────────────────────────────────────────
# PriceHawk AI — Docker Compose (local dev)
#
# Only RabbitMQ is managed here.
# PostgreSQL  → use local install (postgres / 12345678)
# Redis       → reuse redis_matching already running on 6379
# ─────────────────────────────────────────────────────────────────────────────

services:
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: pricehawk-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: pricehawk
      RABBITMQ_DEFAULT_PASS: pricehawk_secret
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5

volumes:
  rabbitmq_data:
