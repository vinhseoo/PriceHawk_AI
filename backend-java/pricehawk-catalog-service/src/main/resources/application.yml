server:
  port: ${CATALOG_SERVICE_PORT:8082}

spring:
  application:
    name: pricehawk-catalog-service
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/catalog_db
    username: ${POSTGRES_USER:pricehawk}
    password: ${POSTGRES_PASSWORD:pricehawk_secret}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:pricehawk}
    password: ${RABBITMQ_PASSWORD:pricehawk_secret}

management:
  endpoints:
    web:
      exposure:
        include: health,info
