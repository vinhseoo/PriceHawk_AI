server:
  port: ${NOTIFICATION_SERVICE_PORT:8085}

spring:
  application:
    name: pricehawk-notification-service
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:pricehawk}
    password: ${RABBITMQ_PASSWORD:pricehawk_secret}
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
    test-connection: false

pricehawk:
  notifications:
    from-email: ${MAIL_FROM:noreply@pricehawk.vn}

management:
  endpoints:
    web:
      exposure:
        include: health,info
