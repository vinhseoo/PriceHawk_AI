server:
  port: ${NOTIFICATION_SERVICE_PORT:8085}

spring:
  application:
    name: smartcart-notification-service
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:smartcart}
    password: ${RABBITMQ_PASSWORD:smartcart_secret}

management:
  endpoints:
    web:
      exposure:
        include: health,info
